[project]
name = "nvidia-gpu-otel-zerobus"
version = "0.1.0"
description = "Simulate NVIDIA DGX GPU-node metrics and stream them into Databricks Delta via Zerobus OpenTelemetry (OTLP) ingest."
requires-python = ">=3.9"
dependencies = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
]

[project.scripts]
# Two entrypoints, same metric generator underneath:
#   quickstart -> export OTLP straight to the Zerobus endpoint (Bearer token in env)
#   production -> export OTLP to a local Collector that holds the OAuth + table header
gpu-sim-quickstart = "gpu_sim.quickstart:main"
gpu-sim-production = "gpu_sim.production:main"
# dcgm-exporter variant: serve DCGM_FI_* metrics in Prometheus format for a Collector to scrape
gpu-sim-dcgm-exporter = "gpu_sim.dcgm_exporter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_sim"]
